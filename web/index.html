<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>my-agent</title>
    <style>
      /* Dark is the default; main.tsx sets data-theme="light" before render
         when the reader has chosen light in Settings. */
      html,
      body {
        margin: 0;
        background: #17181c;
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #f7f7f5;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
