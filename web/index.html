<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="color-scheme" content="light dark" />
    <title>my-agent</title>
    <style>
      /* Light is the default; main.tsx sets data-theme="dark" before render
         when the reader has chosen dark in Settings. */
      html,
      body {
        margin: 0;
        background: #fafafa;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #080808;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
